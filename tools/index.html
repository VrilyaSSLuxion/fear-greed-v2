<script>/* fear-greed-v2 (Testkopie): eigene Browser-Einstellungen, getrennt von der Live-Seite */
(() => { try {
  const ls = window.localStorage, S = Storage.prototype, P = 'v2~', INIT = P + '__init';
  const get = S.getItem, set = S.setItem, del = S.removeItem, key = S.key, clr = S.clear;
  const len = Object.getOwnPropertyDescriptor(S, 'length').get;
  const raw = () => { const a = []; for (let i = 0, n = len.call(ls); i < n; i++) a.push(key.call(ls, i)); return a; };

    for (const k of raw()) if (k && !k.startsWith(P)) try { set.call(ls, P + k, get.call(ls, k)); } catch (e) { }
    set.call(ls, INIT, String(Date.now()));
  }
  const own = () => raw().filter(k => k && k.startsWith(P) && k !== INIT).map(k => k.slice(P.length));
  const mine = s => s === ls;
  S.getItem = function (k) { return get.call(this, mine(this) ? P + k : k); };
  S.setItem = function (k, v) { return set.call(this, mine(this) ? P + k : k, v); };
  S.removeItem = function (k) { return del.call(this, mine(this) ? P + k : k); };
  S.key = function (i) { return mine(this) ? (own()[i] ?? null) : key.call(this, i); };
  S.clear = function () { if (!mine(this)) return clr.call(this); for (const k of own()) del.call(ls, P + k); };
  Object.defineProperty(S, 'length', { configurable: true, enumerable: true, get() { return mine(this) ? own().length : len.call(this); } });
} catch (e) { } })();

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Tools · VrilyaSS</title>
<meta name="description" content="Indikatoren, Expert Advisors und Programme von VrilyaSS – MetaTrader, TradingView und Desktop-Tools.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='6' fill='none' stroke='%23f6c453' stroke-width='4'/%3E%3Cpath d='M10 21l5-6 4 3 5-7' fill='none' stroke='%23d65ac9' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0610; --panel:#160b1b; --panel2:#1c0f24; --line:#2a1b33; --line2:#3a2747;
    --text:#f4eef8; --muted:#a397ae; --dim:#6f6479;
    --pink:#d65ac9; --violet:#a35bd6; --teal:#3fd6c3; --green:#33d39a; --red:#f0566e; --gold:#f6b860; --gold2:#f6c453;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;line-height:1.5;
    padding:18px 16px 80px;-webkit-font-smoothing:antialiased;min-height:100vh;
    background-image:radial-gradient(ellipse 80% 50% at 30% 0%,rgba(120,40,110,.18),transparent 70%)}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer}
  .page{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

  /* Reiter wie auf den anderen Seiten */
  .apptabs{display:flex;gap:4px;padding:4px;border:1px solid var(--line2);border-radius:12px;background:#140a18;width:max-content;max-width:100%;overflow-x:auto}
  .apptabs>*{padding:7px 16px;border-radius:9px;font-weight:800;font-size:14px;color:#cbb8d8;text-decoration:none;letter-spacing:.02em;white-space:nowrap}
  .apptabs>.on{background:var(--gold2);color:#160b1b}
  .apptabs>a:hover{background:#2a1a33;color:#fff}
  .apptabs>.v2chip{background:#3a1020;color:#ffb3c1;font-weight:700}

  /* Kopf */
  .hero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
  .hero h1{font-size:30px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
  .hero h1 span{color:var(--gold2)}
  .hero p{color:var(--muted);margin-top:6px;max-width:640px}
  .search{position:relative;flex:0 1 320px;min-width:220px}
  .search input{width:100%;padding:10px 14px 10px 36px;border-radius:11px;border:1px solid var(--line2);background:var(--panel);color:var(--text);font:inherit;outline:none}
  .search input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(163,91,214,.2)}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.55}

  .catnav{display:flex;gap:8px;flex-wrap:wrap}
  .catnav button{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--text);font-weight:700;font-size:13px}
  .catnav button:hover{border-color:var(--gold2)}
  .catnav b{min-width:22px;padding:0 6px;border-radius:999px;background:var(--line2);color:var(--gold2);font-size:12px;text-align:center}

  /* Bereiche + Karten */
  .cat{display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
  /* Bereich als Kasten zum Auf- und Zuklappen */
  .cat-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;width:100%;padding:13px 18px;border:1.5px solid rgba(255,255,255,.78);border-radius:12px;
    background:rgba(255,255,255,.025);color:var(--text);font:inherit;text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
  .cat-head:hover{border-color:var(--gold2);background:rgba(246,196,83,.05)}
  .cat.open>.cat-head{border-color:var(--gold2)}
  .cat-head h2{font-size:20px;font-weight:800}
  .cat-head .chev{color:var(--gold2);font-size:16px;width:14px}
  .cat-head .sub{color:var(--muted)}
  .cat-head .cnt{margin-left:auto;min-width:30px;padding:2px 10px;border-radius:999px;background:var(--line2);color:var(--gold2);font-size:13px;text-align:center}
  .cat-body{display:flex;flex-direction:column;gap:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  .card{display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:14px;background:var(--panel);overflow:hidden;text-decoration:none;transition:border-color .15s,transform .15s}
  .card:hover{border-color:var(--gold2);transform:translateY(-2px)}
  .thumb{aspect-ratio:16/9;background:#0a050d center/cover no-repeat;border-bottom:1px solid var(--line)}
  .thumb.none{display:flex;align-items:center;justify-content:center;color:var(--dim);font-weight:700}
  .card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card-body h3{font-size:16px;font-weight:800}
  .card-body p{color:var(--muted);font-size:13px;flex:1}
  .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--dim)}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;border:1px solid var(--line2);color:#cbb8d8;white-space:nowrap}
  .badge.ok{border-color:rgba(51,211,154,.5);color:var(--green)}
  .badge.inv{border-color:rgba(214,90,201,.55);color:var(--pink)}
  .badge.mkt{border-color:rgba(63,214,195,.5);color:var(--teal)}
  .badge.soon{border-color:var(--line2);color:var(--muted)}
  .badge.plat{background:var(--panel2)}
  .empty{border:1px dashed var(--line2);border-radius:14px;padding:22px 18px;color:var(--muted);background:rgba(22,11,27,.5)}
  .nohit{color:var(--muted);padding:6px 2px}

  /* Detailansicht */
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:700}
  .back:hover{color:var(--gold2)}
  .detail{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
  .detail h1{font-size:28px;font-weight:800;line-height:1.2}
  .box{border:1px solid var(--line2);border-radius:14px;background:var(--panel);padding:16px 18px}
  .box h2{font-size:15px;font-weight:800;color:var(--gold2);margin-bottom:10px;letter-spacing:.02em}
  .gallery .main{width:100%;aspect-ratio:16/9;border-radius:12px;border:1px solid var(--line2);background:#0a050d center/contain no-repeat;cursor:zoom-in}
  .gallery .cap{color:var(--muted);font-size:13px;margin:8px 2px 10px}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
  .thumbs button{height:48px;border-radius:8px;border:2px solid var(--line2);background:#0a050d center/cover no-repeat;padding:0}
  .thumbs button.on{border-color:var(--gold2)}
  .desc p{margin-bottom:10px}
  .desc p:last-child{margin-bottom:0}
  ul.feat{list-style:none;display:flex;flex-direction:column;gap:7px}
  ul.feat li{padding-left:20px;position:relative}
  ul.feat li::before{content:"";position:absolute;left:3px;top:8px;width:7px;height:7px;border-radius:2px;background:var(--pink)}
  .facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
  .facts dt{color:var(--muted)}
  .facts dd{font-weight:700}
  .actions{display:flex;flex-direction:column;gap:8px}
  .btn{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-radius:11px;text-decoration:none;font-weight:800;border:1px solid var(--line2);background:var(--panel2)}
  .btn:hover{border-color:var(--gold2)}
  .btn.primary{background:linear-gradient(135deg,#8a3fb8,#b34fae);border-color:transparent;color:#fff}
  .btn.primary:hover{filter:brightness(1.1)}
  .btn small{font-weight:600;opacity:.8}
  .hint{border-left:3px solid var(--gold);padding:10px 12px;background:rgba(246,184,96,.07);border-radius:0 10px 10px 0;color:#e9dcc6;font-size:13px}
  .hint + .hint{margin-top:8px}
  .versions{display:flex;flex-direction:column;gap:14px}
  .ver{position:relative;padding-left:18px;border-left:2px solid var(--line2)}
  .ver::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--line2)}
  .ver:first-child::before{background:var(--gold2)}
  .ver h3{font-size:14px;font-weight:800}
  .ver h3 span{color:var(--muted);font-weight:600;margin-left:6px}
  .ver ul{margin:6px 0 0 16px;color:#d9cfe2;font-size:13px}
  .side{display:flex;flex-direction:column;gap:14px}
  .main-col{display:flex;flex-direction:column;gap:14px}

  /* Geschützter Bereich (Platzhalter) */
  .locked{display:flex;gap:16px;align-items:flex-start;border:1px dashed var(--line2);border-radius:14px;padding:18px;background:rgba(22,11,27,.5)}
  .lock-ico{font-size:28px;line-height:1}
  .lock-txt b{font-size:15px;color:var(--gold2)}
  .lock-txt p{color:var(--muted);margin:4px 0 12px;max-width:760px}
  .lock-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .lock-form input{padding:8px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--text);font:inherit;width:200px;opacity:.6}
  .lock-form button{padding:8px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);color:var(--muted);font:inherit;font-weight:700;opacity:.6}
  .lock-form span{color:var(--dim);font-size:12.5px}

  /* TradingView: Gruppen / Einzelliste / Versteckt */
  .tv{display:flex;flex-direction:column;gap:12px}
  .tvbar{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
  .tv button{font:inherit;cursor:pointer}
  /* Rahmen um zusammengehörige Knöpfe (deutlich sichtbar) */
  .seg.box,.optbox{display:flex;align-items:center;gap:4px;padding:4px;border:1.5px solid rgba(255,255,255,.7);border-radius:12px;background:#140a18}
  .seg.box button,.optbox button{padding:6px 12px;border-radius:9px;border:0;background:none;font-weight:800;font-size:13px;color:#cbb8d8;white-space:nowrap}
  .seg.box button:hover,.optbox button:hover{background:#2a1a33;color:#fff}
  .seg.box button.on,.optbox button.on{background:var(--gold2);color:#160b1b}
  .seg.box small,.optbox small{font-weight:700;opacity:.75;margin-left:5px}
  .optbox .lbl{padding:0 6px 0 8px;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;cursor:default;user-select:none}
  .hintsw{gap:8px;padding:7px 12px;color:#cbb8d8;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
  .hintsw input{accent-color:var(--pink);width:15px;height:15px}
  /* Gruppen als Kacheln */
  .groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
  .gcard{border:1px solid var(--line2);border-radius:14px;background:var(--panel);overflow:hidden;display:flex;flex-direction:column}
  .gcard.open{grid-column:1/-1;border-color:var(--gold2)}
  .gtop{display:flex;gap:12px;padding:12px;flex:1}
  .ginfo{min-width:0}
  .gcard h3{font-size:15.5px;font-weight:800;line-height:1.25}
  .gmeta{color:var(--muted);font-size:12.5px;margin-top:2px}
  .gnew{font-size:12.5px;margin-top:6px;color:#d9cfe2;overflow-wrap:anywhere}
  .gnew b{color:var(--gold2);font-weight:700}
  .basis{display:block;color:#e39ad9;font-size:12px;font-weight:600;margin-top:3px}
  .gfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
  .gtog{border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:700;padding:4px 0}
  .gtog:hover,.gtog.is-open{color:var(--gold2)}
  .vers{padding:0 12px 10px}
  /* Vorschaubilder */
  .tvthumb{flex:0 0 var(--tw);width:var(--tw);height:calc(var(--tw) * .5625);border-radius:8px;border:1px solid var(--line);background:#131722;padding:0;overflow:hidden;cursor:zoom-in;display:block}
  .tvthumb img{width:100%;height:100%;object-fit:cover;display:block}
  .tvthumb.g{flex-basis:calc(var(--tw) * 1.1);width:calc(var(--tw) * 1.1);height:calc(var(--tw) * .62)}
  /* Tabelle: Spalten mit Trennlinien */
  .tvlist,.glist{display:flex;flex-direction:column;gap:6px}
  .tvhead,.tvrow,.grow-row{display:grid;align-items:center}
  .tvhead,.tvrow{grid-template-columns:calc(var(--tw) + 24px) minmax(0,1fr) 130px 156px 290px}
  .tv.noimg .tvhead,.tv.noimg .tvrow{grid-template-columns:minmax(0,1fr) 130px 156px 290px}
  .tvhead>*,.tvrow>*,.grow-row>*{padding:0 12px;min-width:0}
  .tvhead>*+*,.tvrow>*+*,.grow-row>*+*{border-left:1px solid #4a3658;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
  .tvhead{padding:6px 0;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid #4a3658}
  .tvhead>*{text-align:left}
  .tvhead button{border:0;background:none;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;padding:0 12px;cursor:pointer;align-items:flex-start}
  .tvhead button:hover,.tvhead button.on{color:var(--gold2)}
  .tvrow{padding:8px 0;border:1px solid var(--line2);border-radius:11px;background:var(--panel)}
  .tvlist.inner .tvrow{background:var(--panel2)}
  .tvrow.hid,.tvtile.hid{border-style:dashed}
  .tvrow .n,.tvtile .n,.grow .n{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .c-ty{align-items:flex-start;gap:4px}
  .c-d{color:#d9cfe2;font-variant-numeric:tabular-nums;font-size:13px}
  .badge.in{border:1.5px solid #9d86b0;color:#efe6f6}
  .badge.st{border:1.5px solid rgba(63,214,195,.85);color:var(--teal)}
  .hidtag{display:inline-block;padding:1px 8px;border-radius:999px;border:1px dashed #8a7a96;color:#b7a9c3;font-size:11px;font-weight:700}
  .acts{display:flex;gap:6px;flex-wrap:nowrap;align-items:center}
  .c-act{align-items:flex-start}
  .tvbtn{padding:5px 11px;border-radius:9px;background:linear-gradient(135deg,#8a3fb8,#b34fae);color:#fff;font-weight:800;font-size:12.5px;text-decoration:none;white-space:nowrap;border:1px solid transparent}
  .tvbtn:hover{filter:brightness(1.12)}
  .tvbtn.off{background:var(--panel2);border-color:var(--line2);color:var(--muted)}
  .tvbtn.sec{background:var(--panel2);border-color:#6b5578;color:#efe6f6}
  .tvbtn.sec:hover{border-color:var(--gold2)}
  .tvbtn.dl{padding:5px 9px}
  /* Gruppen als Liste */
  .grow{border:1px solid var(--line2);border-radius:11px;background:var(--panel)}
  .grow.open{border-color:var(--gold2)}
  .grow-row,.tvhead.g{grid-template-columns:calc(var(--tw) + 24px) minmax(0,1.3fr) 120px 200px minmax(0,1fr) 300px}
  .tv.noimg .grow-row,.tv.noimg .tvhead.g{grid-template-columns:minmax(0,1.3fr) 120px 200px minmax(0,1fr) 300px}
  .grow-row{padding:8px 0}
  .c-cnt{font-weight:800;font-size:13px}
  .c-cnt small,.c-new small{display:block;color:var(--muted);font-weight:600;font-size:11.5px}
  .c-rng{color:#d9cfe2;font-size:13px}
  .c-new b{display:block;color:var(--gold2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grow-row .c-act{flex-direction:row;align-items:center;justify-content:flex-start;gap:10px}
  .grow .vers{padding:0 10px 10px}
  /* Einzel-Skripte als Kacheln */
  .tvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));gap:12px}
  .tvtile{border:1px solid var(--line2);border-radius:12px;background:var(--panel);overflow:hidden;display:flex;flex-direction:column}
  .tvthumb.t{width:100%;height:auto;aspect-ratio:16/9;border:0;border-bottom:1px solid var(--line);border-radius:0;flex:none}
  .tt-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:7px;min-width:0}
  .tt-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tvmore{align-self:center;padding:8px 16px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--text);font-weight:700}
  .tvmore:hover{border-color:var(--gold2)}
  .note{border-left:3px solid var(--gold);padding:10px 12px;background:rgba(246,184,96,.07);border-radius:0 10px 10px 0;color:#e9dcc6;font-size:13px}
  .tvstand{color:var(--dim);font-size:12px}
  .tvstand a{color:var(--muted)}
  @media (max-width:980px){
    .tvhead{display:none}
    .tvrow{grid-template-columns:calc(var(--tw) + 24px) minmax(0,1fr) auto;grid-template-areas:"img nm nm" "img ty d" "img act act";row-gap:6px}
    .tv.noimg .tvrow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm nm" "ty d" "act act"}
    .tvrow>*+*{border-left:0}
    .tvrow .c-img{grid-area:img} .tvrow .c-nm{grid-area:nm} .tvrow .c-ty{grid-area:ty;flex-direction:row;justify-content:flex-start} .tvrow .c-d{grid-area:d} .tvrow .c-act{grid-area:act}
    .tvrow .n{white-space:normal}
    .grow-row,.tv.noimg .grow-row{grid-template-columns:calc(var(--tw) + 24px) minmax(0,1fr);grid-template-areas:"img nm" "img cnt" "img rng" "new new" "act act";row-gap:4px}
    .tv.noimg .grow-row{grid-template-columns:minmax(0,1fr);grid-template-areas:"nm" "cnt" "rng" "new" "act"}
    .grow-row>*+*{border-left:0}
    .grow-row .c-img{grid-area:img} .grow-row .c-nm{grid-area:nm} .grow-row .c-cnt{grid-area:cnt} .grow-row .c-rng{grid-area:rng} .grow-row .c-new{grid-area:new} .grow-row .c-act{grid-area:act}
  }
  @media (max-width:700px){
    .groups{grid-template-columns:1fr}
    .tv.size-gross .gtop{flex-direction:column} .tv.size-gross .tvthumb.g{width:100%;height:auto;aspect-ratio:16/9;flex-basis:auto}

  .lightbox{position:fixed;inset:0;background:rgba(5,2,8,.92);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;cursor:zoom-out}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 10px 50px rgba(0,0,0,.6)}
  .hidden{display:none!important}
  footer{color:var(--dim);font-size:12.5px;border-top:1px solid var(--line);padding-top:14px}

  @media (max-width:860px){ .detail{grid-template-columns:1fr} }
  @media (max-width:520px){
    .apptabs{flex-wrap:wrap;width:auto}
    .hero h1{font-size:24px}
    .detail h1{font-size:22px}
    .grid{grid-template-columns:1fr}
