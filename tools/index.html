<script>/* fear-greed-v2 (Testkopie): eigene Browser-Einstellungen, getrennt von der Live-Seite */
(() => { try {
  const ls = window.localStorage, S = Storage.prototype, P = 'v2~', INIT = P + '__init';
  const get = S.getItem, set = S.setItem, del = S.removeItem, key = S.key, clr = S.clear;
  const len = Object.getOwnPropertyDescriptor(S, 'length').get;
  const raw = () => { const a = []; for (let i = 0, n = len.call(ls); i < n; i++) a.push(key.call(ls, i)); return a; };
  if (get.call(ls, INIT) == null) {
    for (const k of raw()) if (k && !k.startsWith(P)) try { set.call(ls, P + k, get.call(ls, k)); } catch (e) { }
    set.call(ls, INIT, String(Date.now()));
  }
  const own = () => raw().filter(k => k && k.startsWith(P) && k !== INIT).map(k => k.slice(P.length));
  const mine = s => s === ls;
  S.getItem = function (k) { return get.call(this, mine(this) ? P + k : k); };
  S.setItem = function (k, v) { return set.call(this, mine(this) ? P + k : k, v); };
  S.removeItem = function (k) { return del.call(this, mine(this) ? P + k : k); };
  S.key = function (i) { return mine(this) ? (own()[i] ?? null) : key.call(this, i); };
  S.clear = function () { if (!mine(this)) return clr.call(this); for (const k of own()) del.call(ls, P + k); };
  Object.defineProperty(S, 'length', { configurable: true, enumerable: true, get() { return mine(this) ? own().length : len.call(this); } });
} catch (e) { } })();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Tools · VrilyaSS</title>
<meta name="description" content="Indikatoren, Expert Advisors und Programme von VrilyaSS – MetaTrader, TradingView und Desktop-Tools.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='6' fill='none' stroke='%23f6c453' stroke-width='4'/%3E%3Cpath d='M10 21l5-6 4 3 5-7' fill='none' stroke='%23d65ac9' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0610; --panel:#160b1b; --panel2:#1c0f24; --line:#2a1b33; --line2:#3a2747;
    --text:#f4eef8; --muted:#a397ae; --dim:#6f6479;
    --pink:#d65ac9; --violet:#a35bd6; --teal:#3fd6c3; --green:#33d39a; --red:#f0566e; --gold:#f6b860; --gold2:#f6c453;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;line-height:1.5;
    padding:18px 16px 80px;-webkit-font-smoothing:antialiased;min-height:100vh;
    background-image:radial-gradient(ellipse 80% 50% at 30% 0%,rgba(120,40,110,.18),transparent 70%)}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer}
  .page{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

  /* Reiter wie auf den anderen Seiten */
  .apptabs{display:flex;gap:4px;padding:4px;border:1px solid var(--line2);border-radius:12px;background:#140a18;width:max-content;max-width:100%;overflow-x:auto}
  .apptabs>*{padding:7px 16px;border-radius:9px;font-weight:800;font-size:14px;color:#cbb8d8;text-decoration:none;letter-spacing:.02em;white-space:nowrap}
  .apptabs>.on{background:var(--gold2);color:#160b1b}
  .apptabs>a:hover{background:#2a1a33;color:#fff}
  .apptabs>.v2chip{background:#3a1020;color:#ffb3c1;font-weight:700}

  /* Kopf */
  .hero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
  .hero h1{font-size:30px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
  .hero h1 span{color:var(--gold2)}
  .hero p{color:var(--muted);margin-top:6px;max-width:640px}
  .search{position:relative;flex:0 1 320px;min-width:220px}
  .search input{width:100%;padding:10px 14px 10px 36px;border-radius:11px;border:1px solid var(--line2);background:var(--panel);color:var(--text);font:inherit;outline:none}
  .search input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(163,91,214,.2)}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.55}

  .catnav{display:flex;gap:8px;flex-wrap:wrap}
  .catnav button{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--text);font-weight:700;font-size:13px}
  .catnav button:hover{border-color:var(--gold2)}
  .catnav b{min-width:22px;padding:0 6px;border-radius:999px;background:var(--line2);color:var(--gold2);font-size:12px;text-align:center}

  /* Bereiche + Karten */
  .cat{display:flex;flex-direction:column;gap:12px;scroll-margin-top:16px}
  .cat-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .cat-head h2{font-size:20px;font-weight:800}
  .cat-head h2::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--gold2);margin-right:10px;vertical-align:2px}
  .cat-head span{color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  .card{display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:14px;background:var(--panel);overflow:hidden;text-decoration:none;transition:border-color .15s,transform .15s}
  .card:hover{border-color:var(--gold2);transform:translateY(-2px)}
  .thumb{aspect-ratio:16/9;background:#0a050d center/cover no-repeat;border-bottom:1px solid var(--line)}
  .thumb.none{display:flex;align-items:center;justify-content:center;color:var(--dim);font-weight:700}
  .card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card-body h3{font-size:16px;font-weight:800}
  .card-body p{color:var(--muted);font-size:13px;flex:1}
  .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--dim)}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;border:1px solid var(--line2);color:#cbb8d8;white-space:nowrap}
  .badge.ok{border-color:rgba(51,211,154,.5);color:var(--green)}
  .badge.inv{border-color:rgba(214,90,201,.55);color:var(--pink)}
  .badge.mkt{border-color:rgba(63,214,195,.5);color:var(--teal)}
  .badge.soon{border-color:var(--line2);color:var(--muted)}
  .badge.plat{background:var(--panel2)}
  .empty{border:1px dashed var(--line2);border-radius:14px;padding:22px 18px;color:var(--muted);background:rgba(22,11,27,.5)}
  .nohit{color:var(--muted);padding:6px 2px}

  /* Detailansicht */
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:700}
  .back:hover{color:var(--gold2)}
  .detail{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
  .detail h1{font-size:28px;font-weight:800;line-height:1.2}
  .box{border:1px solid var(--line2);border-radius:14px;background:var(--panel);padding:16px 18px}
  .box h2{font-size:15px;font-weight:800;color:var(--gold2);margin-bottom:10px;letter-spacing:.02em}
  .gallery .main{width:100%;aspect-ratio:16/9;border-radius:12px;border:1px solid var(--line2);background:#0a050d center/contain no-repeat;cursor:zoom-in}
  .gallery .cap{color:var(--muted);font-size:13px;margin:8px 2px 10px}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
  .thumbs button{height:48px;border-radius:8px;border:2px solid var(--line2);background:#0a050d center/cover no-repeat;padding:0}
  .thumbs button.on{border-color:var(--gold2)}
  .desc p{margin-bottom:10px}
  .desc p:last-child{margin-bottom:0}
  ul.feat{list-style:none;display:flex;flex-direction:column;gap:7px}
  ul.feat li{padding-left:20px;position:relative}
  ul.feat li::before{content:"";position:absolute;left:3px;top:8px;width:7px;height:7px;border-radius:2px;background:var(--pink)}
  .facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
  .facts dt{color:var(--muted)}
  .facts dd{font-weight:700}
  .actions{display:flex;flex-direction:column;gap:8px}
  .btn{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-radius:11px;text-decoration:none;font-weight:800;border:1px solid var(--line2);background:var(--panel2)}
  .btn:hover{border-color:var(--gold2)}
  .btn.primary{background:linear-gradient(135deg,#8a3fb8,#b34fae);border-color:transparent;color:#fff}
  .btn.primary:hover{filter:brightness(1.1)}
  .btn small{font-weight:600;opacity:.8}
  .hint{border-left:3px solid var(--gold);padding:10px 12px;background:rgba(246,184,96,.07);border-radius:0 10px 10px 0;color:#e9dcc6;font-size:13px}
  .hint + .hint{margin-top:8px}
  .versions{display:flex;flex-direction:column;gap:14px}
  .ver{position:relative;padding-left:18px;border-left:2px solid var(--line2)}
  .ver::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--line2)}
  .ver:first-child::before{background:var(--gold2)}
  .ver h3{font-size:14px;font-weight:800}
  .ver h3 span{color:var(--muted);font-weight:600;margin-left:6px}
  .ver ul{margin:6px 0 0 16px;color:#d9cfe2;font-size:13px}
  .side{display:flex;flex-direction:column;gap:14px}
  .main-col{display:flex;flex-direction:column;gap:14px}

  .lightbox{position:fixed;inset:0;background:rgba(5,2,8,.92);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;cursor:zoom-out}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 10px 50px rgba(0,0,0,.6)}
  .hidden{display:none!important}
  footer{color:var(--dim);font-size:12.5px;border-top:1px solid var(--line);padding-top:14px}

  @media (max-width:860px){ .detail{grid-template-columns:1fr} }
  @media (max-width:520px){
    .apptabs{flex-wrap:wrap;width:auto}
    .hero h1{font-size:24px}
    .detail h1{font-size:22px}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>

  <nav class="apptabs"><a href="../">Fear &amp; Greed</a><a href="../heatmap/">Liquidation Heatmap</a><span class="on">Trading Tools</span><a class="v2chip" href="https://vrilyassluxion.github.io/fear-greed/" title="Das ist die Testkopie. Hier geht es zur Live-Seite." style="background:#3a1020;color:#ffb3c1">TESTKOPIE · Live-Seite ↗</a></nav>
  <main id="app"><p class="nohit">Lade …</p></main>
  <footer>Alle Tools ohne Gewähr – kein Anlagerat. Trading ist mit Risiken verbunden. © VrilyaSS</footer>
</div>

<script src="tools.js"></script>
</body>
</html>
