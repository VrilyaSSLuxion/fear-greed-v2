<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<script>/* fear-greed-v2 (Testkopie): eigene Browser-Einstellungen, getrennt von der Live-Seite */
(() => { try {
  const ls = window.localStorage, S = Storage.prototype, P = 'v2~', INIT = P + '__init';
  const get = S.getItem, set = S.setItem, del = S.removeItem, key = S.key, clr = S.clear;
  const len = Object.getOwnPropertyDescriptor(S, 'length').get;
  const raw = () => { const a = []; for (let i = 0, n = len.call(ls); i < n; i++) a.push(key.call(ls, i)); return a; };
  if (get.call(ls, INIT) == null) {
    for (const k of raw()) if (k && !k.startsWith(P)) try { set.call(ls, P + k, get.call(ls, k)); } catch (e) { }
    set.call(ls, INIT, String(Date.now()));
  }
  const own = () => raw().filter(k => k && k.startsWith(P) && k !== INIT).map(k => k.slice(P.length));
  const mine = s => s === ls;
  S.getItem = function (k) { return get.call(this, mine(this) ? P + k : k); };
  S.setItem = function (k, v) { return set.call(this, mine(this) ? P + k : k, v); };
  S.removeItem = function (k) { return del.call(this, mine(this) ? P + k : k); };
  S.key = function (i) { return mine(this) ? (own()[i] ?? null) : key.call(this, i); };
  S.clear = function () { if (!mine(this)) return clr.call(this); for (const k of own()) del.call(ls, P + k); };
  Object.defineProperty(S, 'length', { configurable: true, enumerable: true, get() { return mine(this) ? own().length : len.call(this); } });
} catch (e) { } })();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quellcode · Trading Tools</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M11 9l-7 7 7 7M21 9l7 7-7 7' fill='none' stroke='%23f6c453' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0c0610;--panel:#160b1b;--panel2:#1c0f24;--line:#2a1b33;--line2:#3a2747;--text:#f4eef8;--muted:#a397ae;--dim:#6f6479;--pink:#d65ac9;--gold2:#f6c453}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;padding:18px 16px 40px;
    background-image:radial-gradient(ellipse 80% 50% at 30% 0%,rgba(120,40,110,.18),transparent 70%)}
  .page{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  .apptabs{display:flex;gap:4px;padding:4px;border:1px solid var(--line2);border-radius:12px;background:#140a18;width:max-content;max-width:100%;overflow-x:auto}
  .apptabs>*{padding:7px 16px;border-radius:9px;font-weight:800;font-size:14px;color:#cbb8d8;text-decoration:none;white-space:nowrap}
  .apptabs>.on{background:var(--gold2);color:#160b1b}
  .apptabs>a:hover{background:#2a1a33;color:#fff}
  h1{font-size:22px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
  .meta{color:var(--muted);font-size:13px}
  .meta b{color:#e39ad9;font-weight:600}
  .bar{display:flex;gap:8px;flex-wrap:wrap}
  .btn{padding:8px 14px;border-radius:10px;border:1px solid #6b5578;background:var(--panel2);color:#efe6f6;font:inherit;font-weight:800;font-size:13px;text-decoration:none;cursor:pointer}
  .btn:hover{border-color:var(--gold2)}
  .btn.primary{background:linear-gradient(135deg,#8a3fb8,#b34fae);border-color:transparent;color:#fff}
  .code{border:1px solid var(--line2);border-radius:12px;background:#0d0a12;overflow:auto;max-height:78vh}
  pre{font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;line-height:1.55;counter-reset:ln;padding:12px 0;min-width:max-content}
  pre .ln{display:block;padding:0 16px 0 0;white-space:pre}
  pre .ln::before{counter-increment:ln;content:counter(ln);display:inline-block;width:52px;padding-right:14px;text-align:right;color:#5d5068;user-select:none}
  pre .cm{color:#8f8a9a} pre .kw{color:#f6c453}
  .msg{color:var(--muted);padding:20px}
  @media (max-width:520px){ .apptabs{flex-wrap:wrap;width:auto} pre{font-size:12px} }
</style>
</head>
<body>
<div class="page">
  <nav class="apptabs"><a href="../">Fear &amp; Greed</a><a href="../heatmap/">Liquidation Heatmap</a><a href="./" class="on">Trading Tools</a><a href="../accounts/">Accounts</a><a class="v2chip" href="https://vrilyassluxion.github.io/fear-greed/" title="Das ist die Testkopie. Hier geht es zur Live-Seite." style="background:#3a1020;color:#ffb3c1">TESTKOPIE · Live-Seite ↗</a></nav>
  <div><h1 id="title">Quellcode</h1><p class="meta" id="meta"></p></div>
  <div class="bar">
    <a class="btn" href="./">← Trading Tools</a>
    <button class="btn" id="copy">Kopieren</button>
    <a class="btn" id="dl" download>⬇ Herunterladen (.pine)</a>
    <a class="btn primary" id="tv" target="_blank" rel="noopener">Skript-Seite auf TradingView ↗</a>
  </div>
  <div class="code"><pre id="src"><span class="msg">Lade Quellcode …</span></pre></div>
</div>
<script>
const id = new URLSearchParams(location.search).get('id') || '';
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const KW = /\b(indicator|strategy|library|input|plot|plotshape|plotchar|hline|fill|var|varip|if|else|for|while|switch|import|export|method|type|true|false|na|ta|math|request|array|matrix|map|label|line|box|table|color|alert|alertcondition)\b/g;
const line = l => { const i = l.indexOf('//'); const code = i >= 0 ? l.slice(0, i) : l, cm = i >= 0 ? l.slice(i) : '';
  return esc(code).replace(KW, '<span class="kw">$1</span>') + (cm ? `<span class="cm">${esc(cm)}</span>` : ''); };
Promise.all([
  fetch('tradingview.json', { cache: 'no-store' }).then(r => r.json()).catch(() => null),
  fetch(`quellcode/tv/${encodeURIComponent(id)}.txt`, { cache: 'no-store' }).then(r => r.ok ? r.text() : Promise.reject(r.status)),
]).then(([tv, src]) => {
  const s = tv?.scripts.find(x => x.id === id) || { n: id };
  document.title = `${s.n} · Quellcode`;
  document.getElementById('title').textContent = s.n;
  const created = s.c ? new Date(s.c).toLocaleString('de-DE', { timeZone: 'Europe/Berlin', dateStyle: 'medium', timeStyle: 'short' }) : '';
  document.getElementById('meta').innerHTML = [created && `Erstellt ${esc(created)}`, `${src.split('\n').length} Zeilen`, s.b && `<b>Beruht auf einem Skript von ${esc(s.b)}</b>`, s.l && `Lizenz ${esc(s.l)}`].filter(Boolean).join(' · ');
  document.getElementById('src').innerHTML = src.split('\n').map(l => `<span class="ln">${line(l)}</span>`).join('');
  const dl = document.getElementById('dl');
  dl.href = URL.createObjectURL(new Blob([src], { type: 'text/plain;charset=utf-8' }));
  dl.download = (s.n.replace(/[^\w\-. äöüÄÖÜß+&()]/g, '').replace(/\s+/g, ' ').trim() || id) + '.pine';
  document.getElementById('tv').href = `https://de.tradingview.com/script/${id}${s.s || ''}/`;
  document.getElementById('copy').onclick = async e => { try { await navigator.clipboard.writeText(src); e.target.textContent = 'Kopiert ✓'; } catch { e.target.textContent = 'Kopieren nicht möglich'; } };
}).catch(() => { document.getElementById('src').innerHTML = '<span class="msg">Der Quellcode für dieses Skript ist nicht verfügbar.</span>'; });
</script>
</body>
</html>
